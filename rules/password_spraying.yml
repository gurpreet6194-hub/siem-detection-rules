title: Password Spraying - One Source Against Many Accounts
id: 9e8d7c6b-5a4f-3e2d-1c0b-9a8f7e6d5c4b
status: experimental
description: |
  Detects password spraying: a single source IP attempting logons against many
  distinct user accounts with only a few tries each. Unlike brute force (many
  attempts, one account), spraying stays under per-account lockout thresholds,
  so the signal is the count of DISTINCT usernames targeted from one IP.
author: Gurpreet Singh
date: 2026/09/28
references:
  - https://attack.mitre.org/techniques/T1110/003/
logsource:
  product: windows
  category: authentication
detection:
  selection:
    EventID: 4625
  timeframe: 15m
  condition: count_distinct(selection, TargetUserName) by IpAddress > 5
falsepositives:
  - Terminal servers / shared jump hosts with many users fat-fingering passwords
level: high
tags:
  - attack.t1110.003   # Brute Force: Password Spraying
  - attack.credential_access
