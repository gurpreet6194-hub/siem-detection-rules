title: RDP Brute Force - Multiple Failed Remote Logons
id: 8f2c1a4b-3d5e-4f6a-9b1c-7e8f9a0b1c2d
status: experimental
description: |
  Detects a potential RDP brute-force attack by counting failed logon attempts
  (Event ID 4625, Logon Type 10 = RemoteInteractive) from a single source IP
  within a short time window. A high burst of failures against one or a few
  accounts is a classic password-guessing indicator.
author: Gurpreet Singh
date: 2026/09/28
references:
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
logsource:
  product: windows
  category: authentication
detection:
  selection:
    EventID: 4625
    LogonType: 10
  timeframe: 5m
  condition: count(selection) by IpAddress > 10
falsepositives:
  - Users mistyping passwords repeatedly, misconfigured services retrying with stale credentials
level: high
tags:
  - attack.t1110.001   # Brute Force: Password Guessing
  - attack.credential_access
