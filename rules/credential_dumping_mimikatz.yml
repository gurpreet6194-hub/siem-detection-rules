title: Credential Dumping Indicators - Mimikatz and LSASS Access Tools
id: 4b5c6d7e-8f9a-0b1c-2d3e-4f5a6b7c8d9e
status: experimental
description: |
  Detects credential-dumping tooling via process creation events: known
  Mimikatz image names, sekurlsa::logonpasswords-style command lines, and
  common LSASS-dumping utilities (procdump, ntdsutil, comsvcs MiniDump).
  Any hit here warrants immediate host isolation and investigation.
author: Gurpreet Singh
date: 2026/09/28
references:
  - https://attack.mitre.org/techniques/T1003/001/
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - 'mimikatz.exe'
      - 'procdump.exe'
      - 'procdump64.exe'
  selection_cli:
    CommandLine|contains|windash:
      - 'sekurlsa::logonpasswords'
      - 'sekurlsa::wdigest'
      - '-ma lsass'
      - 'ntdsutil'
      - 'MiniDump'
  condition: 1 of selection_*
falsepositives:
  - Authorized red-team / purple-team exercises, EDR testing with renamed binaries
level: critical
tags:
  - attack.t1003.001   # OS Credential Dumping: LSASS Memory
  - attack.credential_access
