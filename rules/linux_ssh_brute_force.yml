title: Linux SSH Brute Force - Repeated Failed Password Attempts
id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: |
  Detects SSH brute-force activity on Linux hosts by counting "Failed password"
  messages from sshd for a single source IP within a short time window.
  Matches internet-facing scanners as well as targeted guessing campaigns.
author: Gurpreet Singh
date: 2026/09/28
references:
  - https://www.sigma-hq.io/
logsource:
  product: linux
  service: sshd
detection:
  selection:
    message|contains: 'Failed password'
  timeframe: 5m
  condition: count(selection) by src_ip > 10
falsepositives:
  - Automated config-management or monitoring tools retrying with expired keys
level: high
tags:
  - attack.t1110.001   # Brute Force: Password Guessing
  - attack.credential_access
